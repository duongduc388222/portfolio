<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Background: terminal dark. No gradient. -->
  <rect width="32" height="32" fill="#080808"/>
  <!-- 1px lime hairline border — same vocabulary as the site's .thumb / .card borders. -->
  <rect x="0.5" y="0.5" width="31" height="31" fill="none" stroke="#c5f135" stroke-opacity="0.35" stroke-width="1"/>
  <!-- `>` prompt — two diagonal strokes drawn as pixel rectangles so it stays sharp at 16px. -->
  <g fill="#c5f135">
    <rect x="6"  y="10" width="2" height="2"/>
    <rect x="8"  y="12" width="2" height="2"/>
    <rect x="10" y="14" width="2" height="2"/>
    <rect x="12" y="16" width="2" height="2"/>
    <rect x="10" y="18" width="2" height="2"/>
    <rect x="8"  y="20" width="2" height="2"/>
    <rect x="6"  y="22" width="2" height="2"/>
    <!-- Block cursor following the prompt. -->
    <rect x="18" y="14" width="8" height="8"/>
  </g>
</svg>
